name: Build DSTMods

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          brew install ldid

      - name: Build
        run: |
          export THEOS="$HOME/theos"
          make clean
          make

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: DSTMods
          path: .theos/obj/debug/arm64/DSTMods.dylib
          if-no-files-found: error
